<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="takitaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Rounded squircle background with Emerald Gradient -->
  <rect width="120" height="120" rx="28" fill="url(#takitaGrad)" />

  <!-- Subtle geometric accent rings -->
  <circle cx="95" cy="25" r="35" stroke="white" stroke-width="1.5" stroke-opacity="0.12" fill="none" />
  <circle cx="20" cy="100" r="45" stroke="white" stroke-width="1.5" stroke-opacity="0.08" fill="none" />

  <!-- Top Bar of T -->
  <path
    d="M24 34C24 30.6863 26.6863 28 30 28H90C93.3137 28 96 30.6863 96 34V44C96 47.3137 93.3137 50 90 50H30C26.6863 50 24 47.3137 24 44V34Z"
    fill="white"
    filter="url(#subtleShadow)"
  />

  <!-- Emerald accent chip on top-left -->
  <rect x="28" y="32" width="16" height="14" rx="4" fill="url(#accentGrad)" />

  <!-- Vertical Stem of T -->
  <path
    d="M50 46H70V86C70 90.4183 66.4183 94 62 94H58C53.5817 94 50 90.4183 50 86V46Z"
    fill="white"
    filter="url(#subtleShadow)"
  />

  <!-- Tech Code Brackets < > for Demo/Web Symbolism -->
  <path
    d="M80 60L90 70L80 80"
    stroke="#A7F3D0"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M40 60L30 70L40 80"
    stroke="#A7F3D0"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Sparkle dot -->
  <circle cx="60" cy="74" r="4" fill="#34D399" />
</svg>
